name: test
on:
  push:
  pull_request:
jobs:
  playwright:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # GitHub's Ubuntu runners ship Google Chrome, which playwright.config.js uses (channel: "chrome").
      - run: npm test
