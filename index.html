<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- No zooming: the layout is made for the screen. iPhone Safari ignores user-scalable, so js/main.js also blocks its
     pinch gesture, and css/base.css turns off double-tap zoom. -->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Game Tracker Live</title>
<script>
  // Set the theme before the stylesheets paint (js/theme.js takes over once loaded).
  try {
    const saved = JSON.parse(localStorage.getItem("theme"));
    document.documentElement.dataset.theme = saved || (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
  } catch {
    document.documentElement.dataset.theme = "dark";
  }
  // Opened as the Home Screen app: show the splash screen (below) until the first scores are in (js/main.js).
  if (matchMedia("(display-mode: standalone)").matches || navigator.standalone) document.documentElement.dataset.app = "installed";
  // The Halloween look through October, and Thanksgiving's from the Thursday before Thanksgiving to the Sunday after
  // (js/season.js). A saved "halloween" or "thanksgiving" (true or false) overrides the date, and ?thanksgiving in the
  // address turns Thanksgiving on for that visit (not saved), to preview it on a phone.
  try {
    const now = new Date(), thanksgiving = 22 + (11 - new Date(now.getFullYear(), 10, 1).getDay()) % 7;
    const saved = (key) => JSON.parse(localStorage.getItem(key));
    if (saved("halloween") ?? now.getMonth() === 9) document.documentElement.dataset.season = "halloween";
    if (new URLSearchParams(location.search).has("thanksgiving") || (saved("thanksgiving") ?? (now.getMonth() === 10 && now.getDate() >= thanksgiving - 7 && now.getDate() <= thanksgiving + 3)))
      document.documentElement.dataset.season = "thanksgiving";
  } catch {}
</script>
<meta name="description" content="Follow live college football and NFL games: score, clock, down and distance, and where the ball is.">
<meta name="theme-color" content="#0f1115">
<link rel="icon" href="images/favicon.svg" type="image/svg+xml">

<link rel="manifest" href="manifest.webmanifest">

<meta property="og:type" content="website">

    </g></g>

      <path d="M12 21 Q8 32 12 43 M52 21 Q56 32 52 43" fill="none" stroke="#fff" stroke-width="3.5"/>
      <clipPath id="drumstick-clip-logo"><path d="M1 32 C14 10 50 10 63 32 C50 54 14 54 1 32 Z"/></clipPath>
      <g clip-path="url(#drumstick-clip-logo)"><g class="laces">
        <path d="M22 32 H42" stroke="#fff" stroke-width="5" stroke-linecap="round"/>
        <path d="M26 26 V38 M32 26 V38 M38 26 V38" stroke="#fff" stroke-width="4.5" stroke-linecap="round"/>
      </g></g>
    </g>
  </svg></button>

</header>
