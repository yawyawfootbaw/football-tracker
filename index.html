<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Game Tracker</title>
<style>
  :root {
    --bg: #0f1115; --panel: #181b22; --card: #262a32; --border: #2a2f3a; --text: #e8eaed; --muted: #8b93a1;
    --accent: #4c8dff; --grass: #2e6b34; --grass-alt: #2a6230; --los: #4c8dff; --ltg: #f5d000; --red: #ff5a5a;
    color-scheme: dark;  /* dark native scrollbars and form controls */
  }
  * { scrollbar-width: thin; scrollbar-color: #3a404c transparent; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  header { display: flex; align-items: center; gap: 16px; padding: 12px 16px; border-bottom: 1px solid var(--border); }
  header h1 { font-size: 16px; margin: 0; }
  #updated { color: var(--muted); font-size: 12px; margin-left: auto; }
  #corner { position: fixed; right: 0; bottom: 0; z-index: 5; display: flex; align-items: stretch; gap: 4px; font-size: 11px; }
  #contact { padding: 3px 10px; color: var(--muted); background: var(--bg); border-top-left-radius: 6px; user-select: all; }
  #settings { padding: 0 7px; background: var(--bg); border: 1px solid var(--border); border-bottom: 0; border-radius: 6px 6px 0 0; color: var(--muted); font: inherit; font-size: 12px; cursor: pointer; }
  #settings:hover, #settings[aria-expanded="true"] { color: var(--text); }
  #settings-menu { transform-origin: bottom left; position: absolute; bottom: calc(100% + 4px); left: 0; min-width: 120px; padding: 4px; background: var(--panel); border: 1px solid var(--border); border-radius: 8px; box-shadow: 0 6px 20px rgba(0, 0, 0, .4); }
  #settings-menu button { display: block; width: 100%; padding: 6px 10px; background: none; border: 0; border-radius: 5px; color: var(--text); font: inherit; font-size: 13px; text-align: left; cursor: pointer; }
  #settings-menu button:hover { background: var(--border); }
  #settings-menu .check { display: inline-block; width: 16px; color: var(--accent); visibility: hidden; }
  #settings-menu [aria-pressed="true"] .check { visibility: visible; }
  #coach { position: fixed; right: 12px; bottom: 30px; z-index: 5; width: 150px; margin: 0; cursor: pointer; }
  #coach img { display: block; width: 100%; height: auto; filter: drop-shadow(0 6px 14px rgba(0, 0, 0, .6)); }
  main { display: grid; grid-template-columns: 300px minmax(0, 1fr); height: calc(100vh - 49px); }
  aside { border-right: 1px solid var(--border); overflow-y: auto; }
  .list-head { position: sticky; top: 0; background: var(--bg); border-bottom: 1px solid var(--border); z-index: 1; }
  .tabs { display: flex; border-bottom: 1px solid var(--border); }
  #search { display: block; width: calc(100% - 24px); margin: 8px 12px; padding: 6px 10px; background: var(--panel); border: 1px solid var(--border); border-radius: 6px; color: var(--text); font: inherit; }
  #search:focus { outline: none; border-color: var(--accent); }
  .tabs button { flex: 1; padding: 10px; background: none; border: 0; color: var(--muted); font: inherit; cursor: pointer; border-bottom: 2px solid transparent; }
  .tabs button.on { color: var(--text); border-bottom-color: var(--accent); }
  /* Section headers: a solid bar with a count, so they read as titles rather than rows. */
  .group-label { display: flex; align-items: center; gap: 8px; padding: 7px 12px; background: var(--panel); border-top: 1px solid var(--border); border-bottom: 1px solid var(--border);
    font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--text); }
  .group-label .n { margin-left: auto; padding: 1px 7px; border-radius: 10px; background: var(--border); color: var(--muted); font-weight: 600; letter-spacing: 0; }
  .group-label.selected { color: var(--accent); }
  .group-label.live::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--red); }
  label.game { position: relative; display: flex; align-items: center; gap: 10px; min-height: 52px; padding: 8px 12px; cursor: pointer; -webkit-tap-highlight-color: transparent; }
  label.game:hover { background: var(--panel); }
  label.game:has(input:checked) { background: rgba(76, 141, 255, .12); }
  /* The checkbox stays for keyboards and screen readers; the round + / ✓ button is what you see. */
  label.game input { position: absolute; opacity: 0; width: 1px; height: 1px; pointer-events: none; }
  .pick { flex: none; display: grid; place-items: center; width: 28px; height: 28px; border: 2px solid var(--muted); border-radius: 50%; color: var(--muted); transition: background .15s, border-color .15s; }
  /* Drawn with CSS rather than "+" / "✓" characters, which fonts don't center vertically. */
  .pick::before { content: ""; width: 12px; height: 12px;
    background: linear-gradient(currentColor, currentColor) center / 100% 2px no-repeat,
                linear-gradient(currentColor, currentColor) center / 2px 100% no-repeat; }
  label.game input:checked ~ .pick { background: var(--accent); border-color: var(--accent); color: #fff; }
  label.game input:checked ~ .pick::before { width: 6px; height: 11px; background: none; border: solid currentColor; border-width: 0 2px 2px 0; transform: translateY(-1px) rotate(45deg); }
  label.game input:focus-visible ~ .pick { outline: 2px solid var(--accent); outline-offset: 2px; }
  .drawer-foot { display: none; }
  label.game .info { flex: 1; min-width: 0; }
  label.game .teams { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  label.game .status { color: var(--muted); font-size: 12px; }
  #board { overflow-y: auto; padding: 16px 16px 32px; display: grid; grid-template-columns: repeat(auto-fill, minmax(380px, 1fr)); gap: 16px; align-content: start; }
  .empty { color: var(--muted); padding: 24px; }
  .spinner { width: 32px; height: 32px; margin: 48px auto; border: 3px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin .8s linear infinite; grid-column: 1 / -1; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .card { position: relative; min-width: 0; background: var(--card); border: 1px solid #323846; border-radius: 10px; padding: 12px; }
  .card.redzone { border-color: var(--red); }
  .card.glow { animation: redzone-glow 2.4s ease-in-out; }
  @keyframes redzone-glow {
    50% { box-shadow: 0 0 20px 5px rgba(255, 90, 90, .8); }
  }
  /* Every slot in a card is always rendered at a fixed size (hidden when empty) so cards side by side line up. */
  .score { display: grid; grid-template-columns: minmax(0, 1fr) 76px minmax(0, 1fr); align-items: center; gap: 8px; }
  .team { min-width: 0; display: flex; align-items: center; gap: 8px; font-weight: 600; }
  .team.home { justify-content: flex-end; }
  .team img { flex: none; width: 24px; height: 24px; }
  .team .name { min-width: 0; white-space: nowrap; overflow: hidden; }
  .team.home .name { text-align: right; }
  .team .abbr { overflow: hidden; text-overflow: ellipsis; }
  .team .pts { flex: none; min-width: 2ch; font-size: 22px; line-height: 28px; font-variant-numeric: tabular-nums; }
  .team.away .pts { margin-left: auto; text-align: right; }
  .team.home .pts { margin-right: auto; text-align: left; }
  .team .poss { color: var(--ltg); font-size: 12px; }
  .team .to { color: var(--muted); font-size: 11px; line-height: 15px; font-weight: 400; letter-spacing: 1px; }
  .hide { visibility: hidden; }
  .clock { text-align: center; color: var(--muted); font-size: 12px; line-height: 17px; height: 34px; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; }
  .dd { text-align: center; font-size: 18px; font-weight: 700; margin: 8px 0 6px; height: 25px; line-height: 25px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  svg.field { width: 100%; display: block; border-radius: 4px; }
  .card-foot { display: flex; align-items: center; gap: 8px; margin-top: 6px; }
  .last { flex: 1; min-width: 0; color: var(--muted); font-size: 12px; height: 17px; line-height: 17px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .remove { flex: none; width: 24px; height: 24px; border: 0; border-radius: 6px; background: #9aa0a6; color: #000; font-size: 14px; line-height: 1; cursor: pointer; }
  .remove:hover, .remove:focus-visible { background: #c4c8cc; }
  /* With a mouse, float the ✕ in the top-right corner and show it on hover. Touch screens keep it in the footer. */
  @media (hover: hover) {
    .remove { position: absolute; top: 6px; right: 6px; opacity: 0; transition: opacity .15s; }
    .card:hover .remove, .remove:focus-visible { opacity: 1; }
  }
  #picker-toggle, .drawer-head, #picker-backdrop { display: none; }
  @media (max-width: 700px) {
    main { grid-template-columns: minmax(0, 1fr); height: auto; }
    /* The Games bar stays pinned to the top while the board scrolls. */
    aside { position: sticky; top: 0; z-index: 10; overflow: visible; border-right: 0; border-bottom: 1px solid var(--border); }
    #picker-toggle { display: flex; align-items: center; gap: 10px; width: 100%; padding: 12px 16px; background: var(--panel); border: 0; color: var(--text); font: inherit; font-weight: 600; cursor: pointer; }
    #picker-toggle .count { color: var(--muted); font-weight: 400; margin-left: auto; }
    /* Drawer that slides in from the left over the board. */
    #picker-body { position: fixed; top: 0; bottom: 0; left: 0; z-index: 20; width: min(85vw, 320px); overflow-y: auto;
      background: var(--bg); border-right: 1px solid var(--border); transition: transform .25s ease, visibility 0s; }
    /* Hide from tab focus once closed, but only after the slide finishes. */
    aside.collapsed #picker-body { transform: translateX(-100%); visibility: hidden; transition: transform .25s ease, visibility 0s .25s; }
    .drawer-head { display: flex; align-items: center; padding: 12px 16px; font-weight: 600; }
    .drawer-head button { margin-left: auto; background: none; border: 0; color: var(--muted); font-size: 20px; line-height: 1; cursor: pointer; padding: 0 4px; }
    #picker-backdrop { display: block; position: fixed; inset: 0; z-index: 19; background: rgba(0, 0, 0, .5); transition: opacity .25s ease; }
    aside.collapsed #picker-backdrop { opacity: 0; pointer-events: none; }
    body:has(aside:not(.collapsed)) { overflow: hidden; }
    aside.preload #picker-body, aside.preload #picker-backdrop { transition: none; }
    .drawer-foot { display: block; position: sticky; bottom: 0; padding: 12px 16px; background: var(--bg); border-top: 1px solid var(--border); }
    #picker-done { width: 100%; padding: 12px; border: 0; border-radius: 8px; background: var(--accent); color: #fff; font: inherit; font-weight: 600; cursor: pointer; }
    #board { grid-template-columns: minmax(0, 1fr); padding: 12px 16px 32px; }
  }
</style>
</head>
<body>
<header>
  <h1>Game Tracker</h1>
  <span id="updated"></span>
</header>
<main>
  <aside class="preload">
    <button id="picker-toggle" aria-controls="picker-body"><span aria-hidden="true">☰</span><span>Games</span><span class="count" id="picker-count"></span></button>
    <div id="picker-backdrop"></div>
    <div id="picker-body">
    <div class="list-head">
      <div class="drawer-head">Games<button id="picker-close" aria-label="Close">✕</button></div>
      <div class="tabs">
        <button data-league="cfb">College</button>
        <button data-league="nfl">NFL</button>
      </div>
      <input id="search" type="search" placeholder="Search teams" autocomplete="off">
    </div>
    <div id="list"><div class="spinner" role="status" aria-label="Loading games"></div></div>
    <div class="drawer-foot"><button id="picker-done">Done</button></div>
    </div>
  </aside>
  <section id="board"><div class="spinner" role="status" aria-label="Loading games"></div></section>
</main>
<figure id="coach" hidden>
  <img src="cignetti.png" alt="Indiana head coach Curt Cignetti">
</figure>
<div id="corner">
  <div id="settings-menu" hidden><button id="google-me" aria-pressed="false"><span class="check">✓</span>google me</button></div>
  <button id="settings" aria-label="Settings" aria-expanded="false" aria-controls="settings-menu">⚙&#xFE0E;</button>
  <footer id="contact">contact: sean@homeworkdots.com</footer>
</div>
<script>
const LEAGUES = {
  nfl: "https://site.api.espn.com/apis/site/v2/sports/football/nfl/scoreboard",
  cfb: "https://site.api.espn.com/apis/site/v2/sports/football/college-football/scoreboard?groups=80&limit=300",
};
const POLL_MS = 10000;
const LIST_REFRESH_MS = 30000;  // the picker list refreshes less often than the board so it doesn't shift under your finger
const DEMO = new URLSearchParams(location.search).has("demo");  // ?demo adds a fake red-zone game and skips the hit counter

// Hit counter: each page load adds one. See the count in DevTools → Network → filter "hits.sh" → Preview.
if (!DEMO) {
  const counter = new Image();
  counter.src = "https://hits.sh/yawyawfootbaw.github.io/football-tracker.svg";
}

const store = {
  get(key, fallback) { try { return JSON.parse(localStorage.getItem(key)) ?? fallback; } catch { return fallback; } },
  set(key, value) { try { localStorage.setItem(key, JSON.stringify(value)); } catch {} },
};

let tab = store.get("tab", "cfb");
let selected = new Set(store.get("selected", []));  // "league:eventId"
const games = { nfl: [], cfb: [] };
let demoRemoved = false;          // the demo card isn't in `selected`; removing it lasts until reload
const GLOW_MS = 2400;             // matches the redzone-glow animation length
const redZoneShown = new Set();   // game keys currently drawn in the red zone
const glowStart = new Map();      // game key -> when its one-time glow began

let lastUpdated = null;  // when data last arrived successfully; a failed poll leaves it alone so the age keeps climbing

async function poll() {
  await Promise.all(Object.entries(LEAGUES).map(async ([league, url]) => {
    try {
      const data = await (await fetch(url)).json();
      games[league] = data.events.map((e) => parseEvent(league, e));
      if (DEMO && league === "nfl") games.nfl.unshift(demoGame());
      lastUpdated = Date.now();
    } catch (err) {
      console.error(league, err);
    }
  }));
  renderUpdated();
  // First load (or nothing yet) renders right away; after that the list waits out LIST_REFRESH_MS.
  if (Date.now() - lastListRender >= LIST_REFRESH_MS) renderList();
  renderBoard();
}

function renderUpdated() {
  if (lastUpdated === null) return;
  const secs = Math.floor((Date.now() - lastUpdated) / 1000);
  const mins = Math.floor(secs / 60);
  document.getElementById("updated").textContent = mins
    ? `games updated ${mins} minute${mins === 1 ? "" : "s"} ago`
    : `games updated ${secs} second${secs === 1 ? "" : "s"} ago`;
}
setInterval(renderUpdated, 1000);

function parseEvent(league, e) {
  const comp = e.competitions[0];
  const side = (ha) => {
    const c = comp.competitors.find((t) => t.homeAway === ha);
    return { id: c.team.id, abbr: c.team.abbreviation, logo: c.team.logo,
             // Everything a search can match: "ND", "Notre Dame", "Notre Dame Fighting Irish".
             searchText: " " + [c.team.abbreviation, c.team.shortDisplayName, c.team.displayName, c.team.location]
               .filter(Boolean).join(" ").toLowerCase(),
             color: "#" + (c.team.color || "555"), score: c.score, rank: c.curatedRank?.current };
  };
  // At halftime ESPN keeps the last down and distance around; nobody has the ball, so drop the situation.
  const s = e.status.type.name === "STATUS_HALFTIME" ? {} : comp.situation || {};
  // ESPN often omits `possession` after kickoffs, scores and timeouts. When a down is in progress, the last
  // play's ending team is who has the ball, except for timeouts and period ends, where it's whoever called it.
  const lp = s.lastPlay;
  const possession = s.possession ??
    (s.downDistanceText && !/timeout|end period|end of/i.test(lp?.type?.text || "") ? lp?.end?.team?.id : undefined);
  return {
    key: `${league}:${e.id}`, date: new Date(e.date),
    state: e.status.type.state, detail: e.status.type.shortDetail,
    clock: e.status.displayClock, period: e.status.period,
    home: side("home"), away: side("away"),
    // ESPN's yardLine is yards from the home team's goal line.
    yardLine: s.yardLine, distance: s.distance, possession,
    ddText: s.downDistanceText, redZone: s.isRedZone,
    homeTO: s.homeTimeouts, awayTO: s.awayTimeouts, lastPlay: lp?.text,
  };
}

function demoGame() {
  const team = (id, abbr, color, score) =>
    ({ id, abbr, color, score, searchText: " " + abbr.toLowerCase(), logo: `https://a.espncdn.com/i/teamlogos/nfl/500/${abbr.toLowerCase()}.png` });
  return {
    key: "nfl:demo", date: new Date(), state: "in", detail: "Demo",
    clock: "2:47", period: 4,
    away: team("12", "KC", "#e31837", "17"), home: team("2", "BUF", "#00338d", "20"),
    yardLine: 12, distance: 6, possession: "12", ddText: "3rd & 6 at BUF 12", redZone: true,
    awayTO: 2, homeTO: 1, lastPlay: "Demo game: P.Mahomes pass short right to T.Kelce for 9 yards",
  };
}

function teamLabel(t) {
  return (t.rank && t.rank <= 25 ? `#${t.rank} ` : "") + t.abbr;
}

let lastListRender = -Infinity;
function renderList() {
  lastListRender = Date.now();
  document.querySelectorAll(".tabs button").forEach((b) => b.classList.toggle("on", b.dataset.league === tab));
  const order = { in: 0, pre: 1, post: 2 };
  const groups = { in: "Live", pre: "Upcoming", post: "Final" };
  const query = document.getElementById("search").value.trim().toLowerCase();
  const list = games[tab]
    // Match from the start of a word, so "nd" finds ND and NDSU but not Maryland.
    .filter((g) => !query || g.away.searchText.includes(" " + query) || g.home.searchText.includes(" " + query))
    .sort((a, b) => order[a.state] - order[b.state] || a.date - b.date);
  // Selected games go first under their own heading, keeping the same order as the full list.
  const ordered = [...list.filter((g) => selected.has(g.key)), ...list.filter((g) => !selected.has(g.key))];
  const groupOf = (g) => (selected.has(g.key) ? "Selected" : groups[g.state]);
  const counts = {};
  for (const g of ordered) counts[groupOf(g)] = (counts[groupOf(g)] || 0) + 1;
  let html = "", lastGroup;
  for (const g of ordered) {
    const group = groupOf(g);
    if (group !== lastGroup) html += `<div class="group-label ${group.toLowerCase()}">${group}<span class="n">${counts[group]}</span></div>`;
    lastGroup = group;
    const status = g.state === "pre" ? fmtKickoff(g.date) : g.detail;
    const score = g.state === "pre" ? "" : ` ${g.away.score}–${g.home.score}`;
    html += `<label class="game"><input type="checkbox" data-key="${g.key}" ${selected.has(g.key) ? "checked" : ""}>
      <span class="info"><div class="teams">${teamLabel(g.away)} @ ${teamLabel(g.home)}${score}</div>
      <div class="status">${status}</div></span><span class="pick" aria-hidden="true"></span></label>`;
  }
  document.getElementById("list").innerHTML = html || `<div class="empty">${query ? "No matching games." : "No games this week."}</div>`;
}

function fmtKickoff(d) {
  return d.toLocaleString([], { weekday: "short", hour: "numeric", minute: "2-digit" });
}

function renderBoard() {
  const all = [...games.cfb, ...games.nfl];
  const picked = all.filter((g) => selected.has(g.key) || (g.key === "nfl:demo" && !demoRemoved))
    .sort((a, b) => (a.state === "in" ? 0 : 1) - (b.state === "in" ? 0 : 1) || a.date - b.date);
  document.getElementById("picker-count").textContent = picked.length ? `${picked.length} selected` : "";
  document.getElementById("board").innerHTML = picked.length
    ? picked.map(card).join("")
    : `<div class="empty">Pick games from the list.</div>`;
}

function card(g) {
  const live = g.state === "in";
  const team = (t, side, timeouts) => {
    const pts = `<span class="pts">${g.state === "pre" ? "" : t.score}</span>`;
    const showTO = live && timeouts != null;
    const name = `<div class="name">
        <div><span class="abbr">${teamLabel(t)}</span> <span class="poss ${live && g.possession === t.id ? "" : "hide"}">●</span></div>
        <div class="to ${showTO ? "" : "hide"}">${showTO ? "▮".repeat(timeouts) + "▯".repeat(Math.max(0, 3 - timeouts)) : "▮▮▮"}</div>
      </div>`;
    // ESPN's dark-background variant lives at the same path under 500-dark; fall back to the regular logo if it's missing.
    const darkLogo = t.logo?.replace("/500/", "/500-dark/");
    const logo = `<img src="${darkLogo}" alt="" onerror="this.onerror=null; this.src='${t.logo}'">`;
    // Mirrored: logo on the outside edge, points next to the clock.
    return `<div class="team ${side}">${side === "away" ? logo + name + pts : pts + name + logo}</div>`;
  };
  // Always two lines so the clock column is the same height in every state.
  const clock = live ? `${g.clock}<br>${periodName(g)}`
    : g.state === "pre" ? `${g.date.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" })}<br>${g.date.toLocaleDateString([], { weekday: "short" })}`
    : `${g.detail}<br>&nbsp;`;
  const inRedZone = live && g.redZone;
  if (inRedZone && !redZoneShown.has(g.key)) glowStart.set(g.key, Date.now());  // just entered the red zone
  inRedZone ? redZoneShown.add(g.key) : redZoneShown.delete(g.key);
  // The board re-renders every poll; a negative delay resumes a glow already in progress instead of restarting it.
  const glowAge = Date.now() - (glowStart.get(g.key) ?? -Infinity);
  const glowing = inRedZone && glowAge < GLOW_MS;
  return `<div class="card ${inRedZone ? "redzone" : ""} ${glowing ? "glow" : ""}"
    ${glowing ? `style="animation-delay: -${glowAge}ms"` : ""}>
    <div class="score">${team(g.away, "away", g.awayTO)}<div class="clock">${clock}</div>${team(g.home, "home", g.homeTO)}</div>
    <div class="dd">${live ? (g.ddText || "&nbsp;") : "&nbsp;"}</div>
    ${field(g)}
    <div class="card-foot">
      <div class="last">${live && g.lastPlay ? g.lastPlay : "&nbsp;"}</div>
      <button class="remove" data-remove="${g.key}" aria-label="Remove game" title="Remove game">✕</button>
    </div>
  </div>`;
}

function periodName(g) {
  return g.period <= 4 ? ["1st", "2nd", "3rd", "4th"][g.period - 1] : g.period === 5 ? "OT" : `${g.period - 4}OT`;
}

// Field is 120 units wide: away end zone at 0–10, home end zone at 110–120.
function field(g) {
  const W = 120, H = 30;
  let s = `<svg class="field" viewBox="0 0 ${W} ${H}">`;
  for (let i = 0; i < 10; i++) s += `<rect x="${10 + i * 10}" y="0" width="10" height="${H}" fill="var(--grass${i % 2 ? "-alt" : ""})"/>`;
  s += `<rect x="0" y="0" width="10" height="${H}" fill="${g.away.color}"/>`;
  s += `<rect x="110" y="0" width="10" height="${H}" fill="${g.home.color}"/>`;
  s += endZoneText(5, g.away.abbr) + endZoneText(115, g.home.abbr);
  for (let yd = 10; yd <= 90; yd += 10) {
    s += `<line x1="${10 + yd}" y1="0" x2="${10 + yd}" y2="${H}" stroke="#fff" stroke-opacity=".35" stroke-width=".3"/>`;
    s += `<text x="${10 + yd}" y="${H - 2}" font-size="3" fill="#fff" fill-opacity=".6" text-anchor="middle">${yd <= 50 ? yd : 100 - yd}</text>`;
  }

  if (g.state === "in" && g.yardLine != null) {
    const ball = 10 + (100 - g.yardLine);  // yards from away goal, in field coords
    if (g.possession && g.distance > 0) {
      const dir = g.possession === g.home.id ? -1 : 1;  // home attacks left, away attacks right
      const ltg = Math.min(110, Math.max(10, ball + dir * g.distance));
      s += `<rect x="${Math.min(ball, ltg)}" y="0" width="${Math.abs(ltg - ball)}" height="${H}" fill="var(--ltg)" fill-opacity=".12"/>`;
      s += `<line x1="${ltg}" y1="0" x2="${ltg}" y2="${H}" stroke="var(--ltg)" stroke-width=".8"/>`;
    }
    s += `<line x1="${ball}" y1="0" x2="${ball}" y2="${H}" stroke="var(--los)" stroke-width=".8"/>`;
    s += `<ellipse cx="${ball}" cy="${H / 2}" rx="2.2" ry="1.4" fill="#8b4513" stroke="#fff" stroke-width=".3"/>`;
    if (g.possession) {
      const dir = g.possession === g.home.id ? -1 : 1;
      const tip = ball + dir * 6, base = ball + dir * 3.5;
      s += `<polygon points="${tip},${H / 2} ${base},${H / 2 - 1.8} ${base},${H / 2 + 1.8}" fill="#fff"/>`;
    }
  }
  return s + "</svg>";
}

function endZoneText(x, text) {
  return `<text x="${x}" y="15" font-size="3.4" font-weight="700" fill="#fff" text-anchor="middle"
    dominant-baseline="middle" transform="rotate(${x < 60 ? -90 : 90} ${x} 15)">${text}</text>`;
}

// Replay the red-zone glow when you come back to this tab.
document.addEventListener("visibilitychange", () => {
  if (document.hidden) return;
  for (const key of redZoneShown) glowStart.set(key, Date.now());
  renderBoard();
});

document.getElementById("search").addEventListener("input", renderList);

// Settings gear: one option, which toggles the Cignetti corner photo.
const settingsBtn = document.getElementById("settings");
const settingsMenu = document.getElementById("settings-menu");
let settingsOpen = false;
function setSettingsMenu(open) {
  if (open === settingsOpen) return;
  settingsOpen = open;
  settingsBtn.setAttribute("aria-expanded", open);
  settingsMenu.getAnimations().forEach((a) => a.cancel());
  // Pop up out of the gear (bottom-left corner) and drop back into it.
  const tucked = { opacity: 0, transform: "translateY(6px) scale(.9)" };
  const shown = { opacity: 1, transform: "none" };
  if (open) {
    settingsMenu.hidden = false;
    settingsMenu.animate([tucked, shown], { duration: 160, easing: "cubic-bezier(.2, .9, .3, 1.2)" });
  } else {
    settingsMenu.animate([shown, tucked], { duration: 120, easing: "ease-in" })
      .onfinish = () => { settingsMenu.hidden = true; };
  }
}
settingsBtn.addEventListener("click", (e) => {
  e.stopPropagation();
  setSettingsMenu(!settingsOpen);
});
// Cignetti grows out of a point (the "google me" button) and shrinks back into one (that button or the gear).
const coach = document.getElementById("coach");
const googleMe = document.getElementById("google-me");
function coachOffset(point) {
  const to = coach.getBoundingClientRect();
  const dx = point.left + point.width / 2 - (to.left + to.width / 2);
  const dy = point.top + point.height / 2 - (to.top + to.height / 2);
  return `translate(${dx}px, ${dy}px) scale(.08)`;
}
function showCoach(from) {
  coach.getAnimations().forEach((a) => a.cancel());  // a cancelled hide never fires onfinish
  coach.hidden = false;
  googleMe.setAttribute("aria-pressed", true);
  coach.animate([
    { transform: coachOffset(from), opacity: 0 },
    { opacity: 1, offset: .3 },
    { transform: "none", opacity: 1 },
  ], { duration: 550, easing: "cubic-bezier(.2, .9, .3, 1.15)" });
}
function hideCoach(into) {
  coach.getAnimations().forEach((a) => a.cancel());  // a cancelled hide never fires onfinish
  googleMe.setAttribute("aria-pressed", false);
  coach.animate([
    { transform: "none", opacity: 1 },
    { opacity: 1, offset: .7 },
    { transform: coachOffset(into), opacity: 0 },
  ], { duration: 400, easing: "cubic-bezier(.5, 0, .75, 0)" }).onfinish = () => { coach.hidden = true; };
}
googleMe.addEventListener("click", () => {
  const from = googleMe.getBoundingClientRect();  // measure before the menu closes
  setSettingsMenu(false);
  googleMe.getAttribute("aria-pressed") === "true" ? hideCoach(from) : showCoach(from);
});
coach.addEventListener("click", () => {
  if (googleMe.getAttribute("aria-pressed") === "true") hideCoach(settingsBtn.getBoundingClientRect());
});
document.addEventListener("click", (e) => { if (!settingsMenu.contains(e.target)) setSettingsMenu(false); });
document.addEventListener("keydown", (e) => { if (e.key === "Escape") setSettingsMenu(false); });

// Mobile only: the game picker is a drawer that slides in from the left. Start open if nothing is picked yet.
let pickerOpen = store.get("pickerOpen", selected.size === 0);
function renderPicker() {
  document.querySelector("aside").classList.toggle("collapsed", !pickerOpen);
  document.getElementById("picker-toggle").setAttribute("aria-expanded", pickerOpen);
}
function setPicker(open) {
  pickerOpen = open;
  store.set("pickerOpen", pickerOpen);
  renderPicker();
}
document.getElementById("picker-toggle").addEventListener("click", () => setPicker(!pickerOpen));
document.getElementById("picker-close").addEventListener("click", () => setPicker(false));
document.getElementById("picker-done").addEventListener("click", () => setPicker(false));
document.getElementById("picker-backdrop").addEventListener("click", () => setPicker(false));
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && pickerOpen) setPicker(false); });
renderPicker();
// Skip the slide on first paint; only animate taps.
requestAnimationFrame(() => requestAnimationFrame(() => document.querySelector("aside").classList.remove("preload")));

document.querySelector(".tabs").addEventListener("click", (e) => {
  const league = e.target.dataset?.league;
  if (!league) return;
  tab = league;
  store.set("tab", tab);
  renderList();
});

document.getElementById("list").addEventListener("change", (e) => {
  const key = e.target.dataset.key;
  e.target.checked ? selected.add(key) : selected.delete(key);
  store.set("selected", [...selected]);
  renderListAnimated(key);  // slide it into or out of the Selected group
  renderBoard();
});

// FLIP animation: note where each row was, re-render, then slide every row from its old spot to its new one.
function renderListAnimated(movedKey) {
  const rowsByKey = () => new Map([...document.querySelectorAll("#list label.game")]
    .map((el) => [el.querySelector("input").dataset.key, el]));
  const before = new Map([...rowsByKey()].map(([key, el]) => [key, el.getBoundingClientRect().top]));
  renderList();
  for (const [key, el] of rowsByKey()) {
    const dy = before.has(key) ? before.get(key) - el.getBoundingClientRect().top : 0;
    if (!dy) continue;
    el.style.transform = `translateY(${dy}px)`;
    if (key === movedKey) {  // the moved row passes over the others, so give it a solid background
      el.style.zIndex = 1;
      el.style.background = "var(--panel)";
    }
    requestAnimationFrame(() => requestAnimationFrame(() => {
      el.style.transition = "transform .35s ease";
      el.style.transform = "";
      el.addEventListener("transitionend", () => { el.style.transition = el.style.zIndex = el.style.background = ""; }, { once: true });
    }));
  }
}

document.getElementById("board").addEventListener("click", (e) => {
  const key = e.target.closest("[data-remove]")?.dataset.remove;
  if (!key) return;
  if (key === "nfl:demo") demoRemoved = true;
  selected.delete(key);
  store.set("selected", [...selected]);
  renderList();  // uncheck it in the picker
  renderBoard();
});

poll();
setInterval(poll, POLL_MS);
</script>
</body>
