<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Game Tracker</title>
<script>
  // Set the theme before the stylesheets paint (js/theme.js takes over once loaded).
  try {
    const saved = JSON.parse(localStorage.getItem("theme"));
    document.documentElement.dataset.theme = saved || (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
  } catch {
    document.documentElement.dataset.theme = "dark";
  }
</script>
<meta name="description" content="Follow live college football and NFL games: score, clock, down and distance, and where the ball is.">
<meta name="theme-color" content="#0f1115">
<link rel="icon" href="images/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="images/apple-touch-icon.png">
<!-- Link previews (texts, Slack, social). Preview tags need absolute URLs. -->
<meta property="og:type" content="website">
<meta property="og:title" content="Game Tracker">
<meta property="og:description" content="Follow live college football and NFL games: score, clock, down and distance, and where the ball is.">
<meta property="og:url" content="https://yawyawfootbaw.github.io/football-tracker/">
<meta property="og:image" content="https://yawyawfootbaw.github.io/football-tracker/images/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/picker.css">
<link rel="stylesheet" href="css/board.css">
<link rel="stylesheet" href="css/corner.css">
<link rel="stylesheet" href="css/mobile.css">
<link rel="stylesheet" href="css/loud.css">
<script type="module" src="js/main.js"></script>
</head>
<body>
<header>
  <button id="panel-toggle" aria-label="Hide game list" title="Hide game list" aria-expanded="true" aria-controls="picker-body">☰</button>
  <h1>Game Tracker</h1>
  <span id="updated"></span>
  <button id="theme-toggle"></button>
</header>
<main>
  <aside class="preload">
    <button id="picker-toggle" aria-controls="picker-body"><span aria-hidden="true">☰</span><span>Games</span><span class="count" id="picker-count"></span></button>
    <div id="picker-backdrop"></div>
    <div id="picker-body">
    <div class="list-head">
      <div class="drawer-head">Games<button id="picker-close" aria-label="Close">✕</button></div>
      <div class="tabs">
        <button data-league="cfb">College</button>
        <button data-league="nfl">NFL</button>
      </div>
      <div class="filters">
        <div class="conf-wrap">
          <button id="conf" aria-haspopup="true" aria-expanded="false" aria-controls="conf-menu">All conferences</button>
          <button id="conf-clear" aria-label="Clear conference filter" title="Clear" hidden>✕</button>
          <div id="conf-menu" hidden></div>
        </div>
        <button id="top25" aria-pressed="false">Top 25</button>
      </div>
    </div>
    <div id="list"><div class="spinner" role="status" aria-label="Loading games"></div></div>
    <div class="drawer-foot"><button id="picker-done">Done</button></div>
    </div>
  </aside>
  <section id="board"><div class="spinner" role="status" aria-label="Loading games"></div></section>
</main>
<figure id="coach" hidden>
  <img src="images/cignetti.png" alt="Indiana head coach Curt Cignetti">
</figure>
<div id="corner">
  <div id="settings-menu" hidden><button id="google-me" aria-pressed="false"><span class="check">✓</span>google me</button></div>
  <button id="settings" aria-label="Settings" aria-expanded="false" aria-controls="settings-menu">⚙&#xFE0E;</button>
  <footer id="contact">contact: sean@homeworkdots.com</footer>
</div>
</body>
</html>
