<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Game Tracker</title>
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/picker.css">
<link rel="stylesheet" href="css/board.css">
<link rel="stylesheet" href="css/corner.css">
<link rel="stylesheet" href="css/mobile.css">
<script type="module" src="js/main.js"></script>
</head>
<body>
<header>
  <h1>Game Tracker</h1>
  <span id="updated"></span>
</header>
<main>
  <aside class="preload">
    <button id="picker-toggle" aria-controls="picker-body"><span aria-hidden="true">☰</span><span>Games</span><span class="count" id="picker-count"></span></button>
    <div id="picker-backdrop"></div>
    <div id="picker-body">
    <div class="list-head">
      <div class="drawer-head">Games<button id="picker-close" aria-label="Close">✕</button></div>
      <div class="tabs">
        <button data-league="all">All</button>
        <button data-league="cfb">College</button>
        <button data-league="nfl">NFL</button>
      </div>
      <div class="search-row">
        <input id="search" type="search" placeholder="Search teams" autocomplete="off">
        <button id="filter-toggle" aria-label="Filters" title="Filters" aria-expanded="false" aria-controls="filters">
          <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M2 3h12l-4.5 5.5V13l-3 1.5V8.5z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>
        </button>
      </div>
      <div class="filters-panel" id="filters"><div class="filters-clip"><div class="filters">
        <div class="conf-wrap">
          <select id="conf" aria-label="Conference"><option value="">All conferences</option></select>
          <button id="conf-clear" aria-label="Clear conference filter" title="Clear" hidden>✕</button>
        </div>
        <button id="top25" aria-pressed="false">Top 25</button>
      </div></div></div>
    </div>
    <div id="list"><div class="spinner" role="status" aria-label="Loading games"></div></div>
    <div class="drawer-foot"><button id="picker-done">Done</button></div>
    </div>
  </aside>
  <section id="board"><div class="spinner" role="status" aria-label="Loading games"></div></section>
</main>
<figure id="coach" hidden>
  <img src="images/cignetti.png" alt="Indiana head coach Curt Cignetti">
</figure>
<div id="corner">
  <div id="settings-menu" hidden><button id="google-me" aria-pressed="false"><span class="check">✓</span>google me</button></div>
  <button id="settings" aria-label="Settings" aria-expanded="false" aria-controls="settings-menu">⚙&#xFE0E;</button>
  <footer id="contact">contact: sean@homeworkdots.com</footer>
</div>
</body>
</html>
